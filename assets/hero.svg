<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%">
  <defs>
    <linearGradient id="vox-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050e14"/>
      <stop offset="50%" stop-color="#08141e"/>
      <stop offset="100%" stop-color="#040a0f"/>
    </linearGradient>
    <linearGradient id="vox-wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow-wave" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#vox-bg)"/>

  <!-- Waveform Graphic Right -->
  <g transform="translate(750, 180)">
    <!-- Spectrum Bars -->
    <rect x="-80" y="-30" width="6" height="60" rx="3" fill="#06b6d4" opacity="0.3"/>
    <rect x="-65" y="-55" width="6" height="110" rx="3" fill="#06b6d4" opacity="0.4"/>
    <rect x="-50" y="-85" width="6" height="170" rx="3" fill="#06b6d4" opacity="0.5"/>
    <rect x="-35" y="-120" width="6" height="240" rx="3" fill="#10b981" opacity="0.65"/>
    <rect x="-20" y="-70" width="6" height="140" rx="3" fill="#10b981" opacity="0.75"/>
    <rect x="-5" y="-135" width="6" height="270" rx="3" fill="#10b981" opacity="0.9" filter="url(#glow-wave)"/>
    <rect x="10" y="-95" width="6" height="190" rx="3" fill="#10b981" opacity="0.8"/>
    <rect x="25" y="-140" width="6" height="280" rx="3" fill="#38bdf8" opacity="0.95" filter="url(#glow-wave)"/>
    <rect x="40" y="-60" width="6" height="120" rx="3" fill="#38bdf8" opacity="0.75"/>
    <rect x="55" y="-110" width="6" height="220" rx="3" fill="#38bdf8" opacity="0.7"/>
    <rect x="70" y="-75" width="6" height="150" rx="3" fill="#3b82f6" opacity="0.55"/>
    <rect x="85" y="-45" width="6" height="90" rx="3" fill="#3b82f6" opacity="0.4"/>
    <rect x="100" y="-20" width="6" height="40" rx="3" fill="#3b82f6" opacity="0.3"/>

    <!-- Concentric Audio Pulse Rings -->
    <circle cx="25" cy="0" r="160" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4,6"/>
    <circle cx="25" cy="0" r="210" fill="none" stroke="#06b6d4" stroke-width="0.75" stroke-opacity="0.1"/>
  </g>

  <!-- Left Header Tag -->
  <rect x="70" y="55" width="260" height="26" rx="13" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="85" cy="68" r="4" fill="#10b981"/>
  <text x="98" y="72" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" letter-spacing="2" fill="#34d399">SPEECH-TO-TEXT // VECTOR RAG</text>

  <!-- Main Hero Title -->
  <text x="70" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="62" font-weight="900" letter-spacing="2" fill="#f8fafc">Vox<tspan fill="#10b981">Trace</tspan></text>

  <!-- Subtitle Tagline -->
  <text x="70" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="500" fill="#94a3b8">Multimodal Audio Intelligence &amp; Semantic Vector Pipeline</text>

  <!-- Description paragraph -->
  <text x="70" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#64748b">OpenAI Whisper ASR · HuggingFace Sentence-Transformers · FAISS Dense Retrieval · Grounded FastAPI RAG</text>

  <!-- Capability Badges -->
  <g transform="translate(70, 275)">
    <rect width="145" height="28" rx="6" fill="#0b1b24" stroke="#134e4a" stroke-width="1"/>
    <text x="72.5" y="18" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#a7f3d0">WHISPER ASR</text>
  </g>
  <g transform="translate(225, 275)">
    <rect width="145" height="28" rx="6" fill="#0b1b24" stroke="#134e4a" stroke-width="1"/>
    <text x="72.5" y="18" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#a7f3d0">FAISS VECTORS</text>
  </g>
  <g transform="translate(380, 275)">
    <rect width="145" height="28" rx="6" fill="#0b1b24" stroke="#134e4a" stroke-width="1"/>
    <text x="72.5" y="18" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#a7f3d0">TIMESTAMPS</text>
  </g>
  <g transform="translate(535, 275)">
    <rect width="135" height="28" rx="6" fill="#0b1b24" stroke="#134e4a" stroke-width="1"/>
    <text x="67.5" y="18" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#a7f3d0">FASTAPI RAG</text>
  </g>
</svg>
